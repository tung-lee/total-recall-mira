<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mira — showreel</title>
<style>
@font-face { font-family: 'Inter Tight'; font-weight: 400; src: url(/fonts/inter-tight-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 500; src: url(/fonts/inter-tight-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 600; src: url(/fonts/inter-tight-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 700; src: url(/fonts/inter-tight-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 800; src: url(/fonts/inter-tight-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 900; src: url(/fonts/inter-tight-latin-900-normal.woff2) format('woff2'); }
@font-face { font-family: 'Caveat'; font-weight: 600; src: url(/fonts/caveat-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Caveat'; font-weight: 700; src: url(/fonts/caveat-latin-700-normal.woff2) format('woff2'); }

:root {
  --ink: #0c0c0d; --ink2: #18181b; --paper: #f6f5f1; --blue: #0b84fe; --green: #9be15d; --green-d: #2fb350;
  --pink: #f59ac9; --purple: #7a3fd1; --violet: #a77bff; --lav: #f3edff; --sui: #4da2ff; --amber: #ff9f0a; --red: #ff453a;
  --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; }
.cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
.c { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.dark { background: var(--ink); color: #fff; }
.light { background: var(--paper); }
.grain { position: absolute; inset: -40px; pointer-events: none; z-index: 50; opacity: .07; mix-blend-mode: multiply; background-size: 256px 256px; }
.dark .grain, .grain.on-dark { mix-blend-mode: screen; opacity: .05; }
.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 49; background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.18)); }
.flash { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.wipe { position: absolute; inset: 0; z-index: 61; pointer-events: none; }
.glow { position: absolute; border-radius: 50%; filter: blur(80px); }

/* type */
.kicker { font-family: var(--mono); font-size: 22px; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; }
.mega { font-weight: 800; letter-spacing: -0.065em; line-height: .9; white-space: nowrap; }
.head { font-weight: 800; letter-spacing: -0.05em; line-height: .98; white-space: nowrap; }
.sub { font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; color: rgba(12,12,13,.62); }
.dark .sub { color: rgba(255,255,255,.62); }
.hand { font-family: 'Caveat', cursive; font-weight: 700; }
.piece, .gap { display: inline-block; white-space: pre; }
.mask { overflow: hidden; padding: 0 .06em .08em; }
.mono { font-family: var(--mono); }
.hl { position: relative; display: inline-block; isolation: isolate; }
.hl .mark { position: absolute; left: -2%; right: -2%; bottom: .02em; height: .5em; background: var(--green); z-index: -1; transform-origin: 0 50%; border-radius: 6px; }

/* phone */
.phone { width: 393px; height: 852px; border-radius: 60px; padding: 12px; background: #0d0d0f; box-shadow: 0 0 0 2px #2a2a2e, 0 60px 120px -30px rgba(0,0,0,.45), 0 30px 60px -30px rgba(0,0,0,.3); }
.island { position: absolute; top: 23px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 5; }
.screen { position: relative; height: 100%; border-radius: 48px; overflow: hidden; background: #fff; display: flex; flex-direction: column; font-family: -apple-system, 'SF Pro Text', 'Inter Tight', sans-serif; color: #000; }
.statusbar { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0 46px; font-weight: 600; font-size: 16px; flex: none; }
.statusbar .sb { font-size: 10px; letter-spacing: 1px; }
.im-header { position: relative; display: flex; justify-content: center; padding: 2px 16px 8px; background: rgba(249,249,249,.95); border-bottom: .5px solid rgba(0,0,0,.15); flex: none; }
.im-contact { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.im-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(#fbe3ef, #f7c6de); display: grid; place-items: center; }
.im-name { font-size: 11.5px; } .im-name span { color: #999; }
.im-sub { font-size: 10px; color: #8a8a8e; }
.im-mode { position: absolute; right: 12px; top: 20px; font-size: 10.5px; padding: 3px 8px; border-radius: 99px; background: #e3f8e8; color: #1b8a3a; font-weight: 600; }
.strip { display: flex; gap: 10px; padding: 7px 12px; border-bottom: .5px solid rgba(0,0,0,.1); background: #fbfbfc; flex: none; }
.ss { flex: 1; display: grid; gap: 4px; min-width: 0; }
.ss b { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { display: block; height: 7px; background: #f0f0f2; border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: #34c759; }
.meter.warn i { background: var(--amber); }
.thread { flex: 1; overflow: hidden; padding: 8px 12px 10px; display: flex; flex-direction: column; justify-content: flex-end; }
.wrap { overflow: visible; flex: none; }
.row { display: flex; padding-bottom: 6px; will-change: transform; }
.row.me { justify-content: flex-end; } .row.mira { justify-content: flex-start; } .row.center { justify-content: center; }
.bubble { max-width: 78%; padding: 8px 13px; border-radius: 19px; font-size: 16px; line-height: 1.3; white-space: pre-wrap; }
.row.me .bubble { background: var(--blue); color: #fff; }
.row.mira .bubble { background: #e9e9eb; }
.bubble.typing { display: flex; gap: 4px; padding: 13px 15px; }
.bubble.typing i { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; }
.card { color: #000; background: #fff; border: 1px solid #e7e7ea; border-radius: 22px; padding: 12px 13px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.card-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.card-sub { font-size: 12px; color: #8a8a8e; margin-top: 2px; }
.receipt { width: 76%; display: grid; gap: 4px; }
.receipt-top { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.receipt-top b { margin-left: auto; }
.emoji { font-size: 19px; width: 32px; height: 32px; border-radius: 10px; background: #f3f3f5; display: grid; place-items: center; flex: none; }
.receipt-top .label { font-weight: 500; }
.receipt-why { font-size: 12px; color: #8a8a8e; } .receipt-why.mem { color: var(--purple); font-weight: 600; }
.receipt-sub { font-size: 11.5px; color: #8a8a8e; }
.receipt-left { font-size: 12px; color: #1b7a33; font-weight: 600; }
.receipt-cap { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 11px; color: #6c6c70; }
.trace { background: #f4f4f6; border: 1px solid #ececf0; border-radius: 18px; padding: 9px 13px; width: 76%; font-size: 13px; }
.trace-title { font-weight: 600; margin-bottom: 5px; color: #333; } .trace.done .trace-title { color: #1b8a3a; }
.trace ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.trace li { display: grid; grid-template-columns: 14px 1fr; column-gap: 8px; align-items: center; color: #9a9aa0; }
.trace li .det { grid-column: 2; font-size: 11px; }
.trace li.run, .trace li.done { color: #222; }
.trace .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #c7c7cc; }
.trace li.run .dot { border-color: var(--blue); border-top-color: transparent; }
.trace li.done .dot { background: #34c759; border-color: #34c759; }
.advice { width: 86%; display: grid; gap: 8px; }
.verdict-band { display: flex; gap: 8px; align-items: center; margin: -12px -13px 2px; padding: 9px 13px; border-radius: 21px 21px 0 0; font-weight: 700; font-size: 15px; }
.verdict-band.think { background: #fff2dc; color: #a14800; } .verdict-band.go { background: #e3f8e8; color: #1b8a3a; } .verdict-band.skip { background: #ffe5e3; color: #c4180c; }
.advice-top { display: flex; gap: 10px; align-items: center; }
.why-title { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #8a8a8e; margin-bottom: -4px; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12px; line-height: 1.35; color: #3a3a3c; }
.reasons li.mem { color: #4b2a85; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { border: 1px solid var(--blue); color: var(--blue); background: #fff; border-radius: 99px; padding: 6px 11px; font-size: 13.5px; }
.chip.on { background: var(--blue); color: #fff; }
.moved { width: 80%; display: grid; gap: 9px; }
.moved-top { display: flex; align-items: center; gap: 10px; }
.check { width: 34px; height: 34px; border-radius: 50%; background: #34c759; color: #fff; font-weight: 700; display: grid; place-items: center; }
.pockets { display: flex; gap: 6px; flex-wrap: wrap; }
.pockets span { background: #f3f3f5; border-radius: 99px; padding: 5px 9px; font-size: 11.5px; }
.fine { font-size: 10.5px; color: #9a9aa0; }
.learned { max-width: 94%; }
.learned-item { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; background: var(--lav); border: 1px solid #e6dcff; color: #4b2a85; border-radius: 14px; padding: 6px 10px; font-size: 11.5px; }
.learned-item .lh { font-weight: 700; }
.learned-item .ls { font-weight: 600; color: #b25000; font-size: 10.5px; } .learned-item .ls.ok { color: #1b8a3a; }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px 26px; flex: none; }
.plus { width: 32px; height: 32px; border-radius: 50%; background: #e9e9eb; color: #7c7c80; display: grid; place-items: center; font-size: 20px; }
.field { flex: 1; border: 1px solid #d4d4d8; border-radius: 20px; padding: 7px 13px; color: #a0a0a5; font-size: 15px; }
.touch { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(0,0,0,.35); box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 30; }
.touch-ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--blue); z-index: 29; }

/* big floating UI */
.big-bubble { padding: 26px 40px; border-radius: 56px; font-size: 72px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
.big-bubble.me { background: var(--blue); color: #fff; border-bottom-right-radius: 14px; }
.big-bubble.mira { background: #2a2a2e; color: #fff; border-bottom-left-radius: 14px; }
.big-bubble.mira.light { background: #e9e9eb; color: #000; }
.dots { display: flex; gap: 14px; } .dots i { width: 22px; height: 22px; border-radius: 50%; background: #8e8e93; display: block; }
.composer-big { width: 1100px; height: 110px; border-radius: 60px; border: 3px solid #3a3a3e; display: flex; align-items: center; padding: 0 20px 0 48px; font-size: 52px; color: #fff; gap: 18px; }
.composer-big .ph { color: #5a5a60; }
.caret { display: inline-block; width: 4px; height: 58px; background: var(--blue); vertical-align: middle; margin-left: 4px; border-radius: 2px; }
.send-big { margin-left: auto; width: 80px; height: 80px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; font-size: 44px; color: #fff; font-weight: 700; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 99px; padding: 14px 26px; font-size: 30px; font-weight: 600; white-space: nowrap; }
.tile { border-radius: 28px; padding: 26px 28px; background: #fff; box-shadow: 0 20px 50px -24px rgba(0,0,0,.25); border: 1px solid #ececf0; }
.dark .tile { background: #17171a; border-color: #2a2a2e; box-shadow: none; }
.line { font-family: var(--mono); font-size: 30px; padding: 18px 26px; border-radius: 18px; white-space: nowrap; background: #1d1430; color: #e8dcff; border: 1px solid #3a2a63; }
.line b { color: #fff; font-weight: 700; }
.shot { border-radius: 26px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); background: #fff; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.node { border-radius: 26px; padding: 22px 28px; font-size: 28px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 14px; }
.node small { display: block; font-size: 18px; font-weight: 500; opacity: .7; margin-top: 4px; }
.stat b { display: block; font-size: 84px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
.stat span { display: block; font-size: 22px; color: rgba(255,255,255,.6); margin-top: 10px; font-weight: 500; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/film.js"></script>
</body>
</html>
